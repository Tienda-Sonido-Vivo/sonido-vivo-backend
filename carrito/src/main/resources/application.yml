server:
  port: 8083

spring:
  application:
    name: sonido-vivo-carrito
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_carrito?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET_BASE64}
  internal-token: ${INTERNAL_SERVICE_TOKEN}

services:
  catalogo:
    url: ${CATALOGO_SERVICE_URL:http://SONIDO-VIVO-CATALOGO}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

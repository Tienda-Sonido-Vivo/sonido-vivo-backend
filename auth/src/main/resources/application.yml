server:
  tomcat:
    threads:
      max: 40
      min-spare: 5
  port: 8080

spring:
  application:
    name: sonido-vivo-auth
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:admin@demo.cl}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

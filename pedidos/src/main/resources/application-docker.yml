spring:
  datasource:
    url: jdbc:mysql://mysql:3306/sonido_vivo_pedidos?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

services:
  catalogo:
    url: http://SONIDO-VIVO-CATALOGO
  carrito:
    url: http://SONIDO-VIVO-CARRITO
  pagos:
    url: http://SONIDO-VIVO-PAGOS
  ventas:
    url: http://SONIDO-VIVO-VENTAS

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

services:
  mysql:
    image: mysql:8.4
    container_name: sonido-vivo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - sonido-vivo-mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - sonido-vivo-network

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: eureka-server
    container_name: sonido-vivo-eureka
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8761:8761"
    networks:
      - sonido-vivo-network

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    container_name: sonido-vivo-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Define JWT_SECRET_BASE64 en .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define INTERNAL_SERVICE_TOKEN en .env}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@demo.cl}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Define ADMIN_BOOTSTRAP_PASSWORD en .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - sonido-vivo-network

  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalogo
    container_name: sonido-vivo-catalogo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - sonido-vivo-network

  mensajeria:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: mensajeria
    container_name: sonido-vivo-mensajeria
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - sonido-vivo-network

  carrito:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: carrito
    container_name: sonido-vivo-carrito
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root

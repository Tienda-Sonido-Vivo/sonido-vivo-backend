    container_name: sonido-vivo-ventas
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8087:8087"
    networks:
      - sonido-vivo-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: sonido-vivo-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "8090:8090"
    networks:
      - sonido-vivo-network

volumes:
  sonido-vivo-mysql-data:

networks:
  sonido-vivo-network:
    driver: bridge

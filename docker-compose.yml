      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - sonido-vivo-network

  pedidos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pedidos
    container_name: sonido-vivo-pedidos
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
